# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

name: Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Cache the MiniLM ONNX model
        id: hf-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: huggingface-paraphrase-MiniLM-L6-v2-onnx-c9a2bfe
      - name: Run the automated tests
        env:
          # with a cached model, avoid contacting the Hugging Face Hub (rate limits)
          HF_HUB_OFFLINE: ${{ steps.hf-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: uv run pytest -v --cov .
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
