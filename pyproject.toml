[project]
name = "sample-explorer"
version = "0.1.9"
description = "SampleExplorer: A tool for textual and gene set search against ARCHS4 data"
authors = [{ name = "wlchin", email = "chalky_peccary_0@proton.me" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.0,<4",
    "numpy>=2.5.4,<3",
    "anndata>=0.13.4,<0.14",
    "scipy>=1.18.1,<2",
    "tqdm>=4.70.1,<5",
    "requests>=2.34.2,<3",
    "h5py>=3.16.0,<4",
    "onnxruntime>=1.31.0,<2",
    "tokenizers>=0.23.3,<1",
    "huggingface-hub>=2.3.0,<3",
]

[project.scripts]
biorag = "sample_explorer.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "coverage>=7.17.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
omit = [
    "tests/*"
    ]
